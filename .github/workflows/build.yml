name: Build with MSBuild

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Восстанавливаем NuGet пакеты
    - name: Restore NuGet packages
      run: nuget restore xrEngine.sln

    # Настраиваем MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
       with:
         vs-version: '2019'

    # Собираем проект
    - name: Build Release
      run: msbuild xrEngine.sln /p:Configuration=Release /p:Platform=Win32 /m

    # (Опционально) Собрать ещё и для x64, если нужно
    # - name: Build Release (x64)
    #   run: msbuild xrEngine.sln /p:Configuration=Release /p:Platform=x64 /m

    # (Опционально) Запустить тесты
    # - name: Run tests
    #   run: vstest.console.exe **\*Tests.dll

    # Сохраняем собранные файлы как артефакт (например, .exe, .dll)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Release-Win32
        path: |
          **\bin\Release\*
          **\x64\Release\*
        if-no-files-found: error
