name: Build with MSBuild

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release
      run: msbuild xrEngine.sln /p:Configuration=Release /p:Platform=Win32 /m

    - name: Build Debug
      run: msbuild xrEngine.sln /p:Configuration=Debug /p:Platform=Win32 /m