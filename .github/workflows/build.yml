name: Build with MSBuild (VS 2019)

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build release
      run: msbuild xrEngine.sln /p:Configuration=Release /p:Platform=Win32 /m

    - name: Build debug
      run: msbuild xrEngine.sln /p:Configuration=Debug /p:Platform=Win32 /m
